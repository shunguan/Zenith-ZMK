# Zenith + Prospector dongle (split central, USB connected)

# The dongle runs off USB and drives a screen, so never let it deep sleep.
CONFIG_ZMK_SLEEP=n

# Prospector display options. Defaults come from the prospector_adapter shield;
# uncomment a line here to override it.

# --- Backlight off while the computer is asleep.
# Implemented in src/dongle_backlight.c in this repo: it watches the USB bus for
# suspend -- which is what host sleep looks like to the dongle -- and drives the
# backlight PWM to 0, then back to FIXED_BRIGHTNESS on resume.
#
# The two settings below are a HARD REQUIREMENT for that, not a preference.
# With the ambient light sensor enabled the module re-sets the backlight from
# its own reading about every 100ms, so it would overwrite the 0 and the screen
# would flicker instead of going dark. With the sensor disabled the module sets
# brightness exactly once at init, so the 0 stays put. Kconfig enforces this.
#
# It also matches the hardware: the APDS9960 is optional in the Prospector BOM
# and a touch-wired build typically omits it.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Not used here: ZMK's own CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE keys off typing
# inactivity rather than host sleep, and blanks only the LCD controller, leaving
# this separately-driven backlight lit. The dongle also never reaches
# ZMK_ACTIVITY_SLEEP -- ZMK gates deep sleep on !is_usb_power_present().

# Screen mounted the other way up in the case.
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Layer names on the roller in all caps.
# CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=y
