# Zenith + Prospector dongle (split central, USB connected)

# The dongle runs off USB and drives a screen, so never let it deep sleep.
CONFIG_ZMK_SLEEP=n

# --- Modifier indicators (the reason this tree moved to the module's
# --- feat/new-status-screens branch; they do not exist on the module's main).
# Default is already y, set explicitly so a default change upstream cannot
# silently turn them off again.
CONFIG_PROSPECTOR_SHOW_MODIFIERS=y

# Show inactive modifiers dimmed rather than hiding them until pressed.
# Only affects the classic and field layouts.
CONFIG_PROSPECTOR_SHOW_INACTIVE_MODIFIERS=y

# Mac glyphs (Cmd/Opt), matching this machine. Alternatives:
#   CONFIG_PROSPECTOR_MODIFIER_OS_WINDOWS=y
#   CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y   # CTRL / ALT / GUI / SHFT
CONFIG_PROSPECTOR_MODIFIER_OS_MAC=y

# Left-to-right order of the four indicators.
# G=GUI/Cmd  A=Alt/Opt  C=Control  S=Shift -- exactly four characters, no repeats.
CONFIG_PROSPECTOR_MODIFIER_ORDER="GACS"

# --- Status screen layout. Classic is the default; uncomment one to switch.
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y      # colourful rounded grid
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y      # minimal, typing-activity flow
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y   # dense, adds a WPM meter

# --- Screen blanking when the keyboard goes unused.
# ZMK defaults this on only for SSD1306 OLEDs, so it is off for our ST7789V
# until asked for. Two limits worth knowing:
#   1. It follows KEY ACTIVITY, not the host's sleep state. Nothing here can
#      see the computer sleep; see below for the signal that can.
#   2. It calls display_blanking_on(), which blanks the LCD controller. The
#      Prospector's backlight is a SEPARATE PWM LED (the disp_bl node) and
#      nothing turns it off, so expect a black-but-lit panel, not a dark one.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ZMK's default is 30000 (30s), which blanks the screen while you are still
# reading it. 10 minutes suits a desk display. Any keypress wakes it.
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Note: the dongle can reach ZMK_ACTIVITY_IDLE but never ZMK_ACTIVITY_SLEEP --
# ZMK gates deep sleep on !is_usb_power_present(), and the dongle is always on
# USB. So CONFIG_ZMK_SLEEP above stays irrelevant here either way.

# --- Display options.

# No APDS9960 ambient light sensor fitted: use a fixed brightness instead.
# Uncomment BOTH lines together -- FIXED_BRIGHTNESS only applies when the
# sensor is disabled.
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Screen mounted the other way up in the case.
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Layer names in uppercase. Default is already y on this branch. (Note: the
# module's main branch had an equivalent option that never worked -- its
# Kconfig symbol and the code's #if disagreed. This one is wired up.)
# CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=n
