# Zenith + Prospector dongle (split central, USB connected)

# The dongle runs off USB and drives a screen, so never let it deep sleep.
CONFIG_ZMK_SLEEP=n

# Prospector display options. Defaults come from the prospector_adapter shield;
# uncomment a line here to override it.

# No APDS9960 ambient light sensor fitted: use a fixed brightness instead.
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Screen mounted the other way up in the case.
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Layer names on the roller in all caps.
# CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=y
